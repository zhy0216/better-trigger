<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-labelledby="logo-title logo-description">
  <title id="logo-title">better-trigger</title>
  <desc id="logo-description">A simple lightning mark for better-trigger</desc>
  <defs>
    <linearGradient id="surface" x1="10" y1="8" x2="86" y2="88" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8585FF"/>
      <stop offset="0.52" stop-color="#6E6EFF"/>
      <stop offset="1" stop-color="#5148D8"/>
    </linearGradient>
    <linearGradient id="bolt" x1="39" y1="14" x2="58" y2="83" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAEAFF"/>
    </linearGradient>
    <radialGradient id="shine" cx="0" cy="0" r="1" gradientTransform="translate(28 16) rotate(48) scale(62)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="bolt-shadow" x="-25%" y="-20%" width="150%" height="155%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#171735" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="90" height="90" rx="27" fill="#171735"/>
  <rect x="5" y="5" width="86" height="86" rx="25" fill="url(#surface)"/>
  <rect x="5" y="5" width="86" height="86" rx="25" fill="url(#shine)"/>

  <!-- the trigger: one bold, legible bolt at every size -->
  <path d="M55 12L25 49H45L40 84L72 39H52L55 12Z" fill="url(#bolt)" filter="url(#bolt-shadow)"/>
</svg>
