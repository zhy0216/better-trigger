# =============================================================================
# better-trigger — local infra.
#
#   docker compose up -d                  # postgres + the worker daemon
#   docker compose up -d postgres         # postgres only (run the daemon on the host)
#
# The `worker` service is the daemon: it owns Postgres, executes tasks and
# serves the API that the SDK and apps/web talk to. It starts with no --tasks,
# so out of the box it serves the API and executes nothing — mount your task
# module and add `--tasks` (see the commented lines below) to execute.
# =============================================================================
services:
  postgres:
    image: postgres:16-alpine
    container_name: better-trigger-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: better_trigger
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - better-trigger-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d better_trigger']
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: better-trigger-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/better_trigger
      PORT: '4848'
      # BETTER_TRIGGER_API_KEY: change-me   # uncomment to require Bearer auth
      # The image binds 0.0.0.0 (a container has to), so the daemon wants an
      # API key before it starts. Safe here only because the port below is
      # published to the host's loopback: nothing outside this machine can
      # reach it. Drop this line if you set BETTER_TRIGGER_API_KEY.
      BETTER_TRIGGER_ALLOW_UNAUTHENTICATED: '1'
      # Browsers only get CORS headers for loopback origins (any port), which
      # covers the dashboard. Serving it from somewhere else? List that origin:
      # BETTER_TRIGGER_CORS_ORIGIN: https://ops.example.com
    ports:
      # Host side stays on loopback — publishing '4848:4848' would put an
      # unauthenticated task-trigger API on every interface of this machine.
      - '127.0.0.1:4848:4848'
    # To execute your tasks, mount them in and point the daemon at the module:
    # volumes:
    #   - ./tasks.js:/app/tasks.js:ro
    # command: ['bun', 'apps/worker/dist/main.js', '--tasks', '/app/tasks.js']

volumes:
  better-trigger-pgdata:
