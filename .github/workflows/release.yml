# =============================================================================
# Release — version bump, npm publish in the fixed dependency order, then
# commit + tag. Manual only (workflow_dispatch): publishing is the one CI
# step that cannot be undone, and a release is a human decision.
#
# The publish order is load-bearing: each package depends on the earlier
# ones, and the registry cannot resolve a dependent before its dep exists.
#
#   core → db → kernel → sdk → worker   (worker ships last)
#
# Publishes via npm trusted publishing (OIDC): the job's short-lived
# id-token is exchanged for a one-time publish credential by npm >= 11.5.1,
# and every tarball ships a signed provenance attestation pointing at this
# repo, workflow and commit. No long-lived npm token is read anywhere here.
# External prerequisite: the npm account must list this repo +
# .github/workflows/release.yml as a trusted publisher for all five packages.
# The final push uses the workflow's GITHUB_TOKEN (permissions:
# contents: write below); if `main` is branch-protected that push is
# rejected and the tag must be pushed manually — every publish has already
# succeeded at that point, so nothing gets re-run.
# =============================================================================
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version bump for the five publishable packages: `patch` | `minor` |
          `major` (from each package's current version) or an explicit
          semver such as `0.2.0` (sets every package to exactly that
          version). Pre-releases work via semver, e.g. `0.2.0-beta.1`.
          RETRY NOTE: npm refuses to overwrite a published version. If a
          previous attempt failed AFTER some packages published, re-run with
          a NEW explicit version (e.g. 0.1.2) — do not reuse the same input.
        required: true
        default: patch

permissions:
  contents: write
  # npm trusted publishing: the OIDC id-token is the ONLY publish credential.
  id-token: write

# P2-20 C4: publishing is the one CI step that cannot be undone, so two
# overlapping dispatches interleaving across bump/publish is the failure mode
# to rule out — ci.yml has carried this guard all along, release.yml did not.
# cancel-in-progress: false is deliberate: a release already halfway through
# its publish order must run to completion, never be torn down by a newer
# dispatch.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # P2-20: raised from 30 — the gate now also runs the acceptance
    # harnesses (same sequence the main CI job completes inside its 20-minute
    # budget, plus the publish tail here).
    timeout-minutes: 40

    # P2-20 C4: the pre-release gate was "the CI sequence minus acceptance"
    # because this workflow had no Postgres. ci.yml proves the fix is cheap —
    # same service container as its main job, so acceptance can gate releases.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: better_trigger
        ports:
          - 5432:5432
        # The harnesses connect immediately on start; wait for a real handshake.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # Each harness derives its own database name from this base URL and
      # provisions it via the admin `postgres` database (DROP/CREATE).
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/better_trigger

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      # Node is only for npm (version bump + publish); builds and tests run
      # under bun, like the main CI job. No registry-url: it would make
      # setup-node write an _authToken .npmrc, and trusted publishing must
      # authenticate with the job's OIDC id-token instead. The default
      # registry is already registry.npmjs.org.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # npm trusted publishing needs Node >= 22.14 and npm >= 11.5.1. Pin
      # npm exactly (setup-node's bundled npm is older than 11.5.1 on both
      # the 20 and 24 lines) and assert both minimums before anything else
      # touches the registry.
      - name: Assert Node/npm meet the trusted publishing minimums
        run: |
          set -euo pipefail
          npm install --global --no-audit --no-fund npm@11.5.1
          node -e '
            const cp = require("child_process");
            const gte = (v, min) => {
              const a = v.split(".").map(Number), b = min.split(".").map(Number);
              for (let i = 0; i < 3; i++) if ((a[i] ?? 0) !== (b[i] ?? 0)) return (a[i] ?? 0) > (b[i] ?? 0);
              return true;
            };
            const node = process.versions.node;
            const npm = cp.execSync("npm -v", { encoding: "utf8" }).trim();
            console.log("node " + node + " / npm " + npm);
            if (!gte(node, "22.14.0")) throw new Error("npm trusted publishing requires Node >= 22.14");
            if (!gte(npm, "11.5.1")) throw new Error("npm trusted publishing requires npm >= 11.5.1");
          '

      # P2-20: same lockfile-keyed bun cache as ci.yml (see its comment).
      - name: Cache bun dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            examples/*/node_modules
            .turbo/cache
          key: ${{ runner.os }}-bun-1.4.0-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-1.4.0-

      - name: Install
        run: bun install --frozen-lockfile

      # ------------------------------------------------------------------
      # Pre-release gate: the full CI sequence — packaging guards, build,
      # typecheck, unit tests, the O4 clean-install smoke, and since p2-20
      # the acceptance harnesses too (the postgres service above removed the
      # old "no Postgres in this workflow" excuse). Everything must be green
      # on the exact tree that is about to be published.
      # ------------------------------------------------------------------
      - name: Lint
        run: bun run lint

      - name: Dependency guard
        run: bun run check:deps

      - name: Migration drift
        run: bun run check:drift

      - name: Build
        env:
          BT_GIT_SHA: ${{ github.sha }}
        run: bun run --bun build

      - name: Package exports
        run: bun run check:exports

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      # O4 smoke on the CURRENT versions — the same core assertions as the
      # main CI job's pack step: the registry artifact must work outside the
      # workspace, the worker must ship the dashboard, and the packed dist
      # must carry the manifest version.
      - name: Pack + clean-install smoke (O4)
        run: |
          set -euo pipefail
          pack_dir=$(mktemp -d)
          for pkg in packages/core packages/kernel packages/db packages/sdk apps/worker; do
            (cd "$pkg" && bun pm pack --destination "$pack_dir" --quiet)
          done
          install_dir=$(mktemp -d)
          (
            cd "$install_dir"
            npm init -y >/dev/null 2>&1
            npm install --no-audit --no-fund "$pack_dir"/*.tgz
          )
          check_dir=$(mktemp -d)
          tar -xzf "$pack_dir"/better-trigger-worker-*.tgz -C "$check_dir"
          test -f "$check_dir/package/dist/public/index.html"
          "$install_dir/node_modules/.bin/better-trigger-worker" --help |
            grep -q -- '--tasks'
          (cd "$install_dir" && node -e \
            "const bt = require('better-trigger'); if (typeof bt.task !== 'function') process.exit(1)")
          (cd "$install_dir" && node --input-type=module -e \
            "import('better-trigger').then((m) => { if (typeof m.task !== 'function') process.exit(1) })")
          (cd "$install_dir" && node -e \
            "const e = require('@better-trigger/worker/embedded'); if (typeof e.createEmbeddedRuntime !== 'function') process.exit(1)")
          (cd "$install_dir" && node --input-type=module -e \
            "import('@better-trigger/worker/embedded').then((m) => { if (typeof m.createEmbeddedRuntime !== 'function') process.exit(1) })")
          ver=$(node -e \
            "console.log(JSON.parse(require('fs').readFileSync('$check_dir/package/package.json','utf8')).version)")
          grep -rqF "\"$ver\"" "$check_dir/package/dist" || {
            echo "dist does not carry the packed version $ver (stale dist?)"
            exit 1
          }

      # P2-20 C4: the acceptance suite is the project's real correctness
      # evidence — ci.yml has always gated on it, and the tree that passes CI
      # is the tree that should be publishable. Publishing a main that fails
      # acceptance was previously possible (the gate skipped it for want of a
      # Postgres service); now it is not. Same command, same service, same
      # DATABASE_URL shape as the main CI job.
      - name: Acceptance harnesses
        run: bun run test:acceptance

      # ------------------------------------------------------------------
      # Version bump. The five publishable packages move together; the root
      # (private) and the private apps stay untouched. The script ALSO syncs
      # the new versions into bun.lock — `bun pm pack` rewrites workspace:*
      # deps from the LOCKFILE's workspace versions, so bumping package.json
      # alone would pack manifests that depend on the previous, unpublished
      # versions. No git tag here — the tag is created only after every
      # publish has succeeded.
      # ------------------------------------------------------------------
      - name: Bump versions (package.json + bun.lock)
        run: node scripts/bump-versions.mjs ${{ inputs.version }}

      # Rebuild AFTER the bump: the worker build stamps the package version
      # into dist/ (scripts/write-build-info.mjs), and the O4 smoke above
      # proves the shipped dist must carry the manifest version — a pack
      # made from the pre-bump dist would ship "new manifest + stale dist".
      - name: Rebuild with bumped version
        env:
          BT_GIT_SHA: ${{ github.sha }}
        run: bun run --bun build

      # Pack with `bun pm pack`: it rewrites workspace:* deps to exact
      # versions (npm pack/publish do NOT — publishing straight from the
      # package dirs would ship uninstallable manifests). These tarballs are
      # the exact publish artifacts.
      - name: Pack release tarballs
        run: |
          pack_dir=$(mktemp -d)
          for pkg in packages/core packages/db packages/kernel packages/sdk apps/worker; do
            (cd "$pkg" && bun pm pack --destination "$pack_dir" --quiet)
          done
          echo "PACK_DIR=$pack_dir" >> "$GITHUB_ENV"

      # Post-bump consistency gate, the half the pre-bump O4 smoke cannot
      # prove: the BUMPED tarballs must depend on the versions in this pack
      # set (a lockfile that drifted would leave deps pinned to the previous
      # version), and they must install cleanly from a temp dir.
      - name: Post-bump pack consistency
        run: |
          set -euo pipefail
          install_dir=$(mktemp -d)
          (
            cd "$install_dir"
            npm init -y >/dev/null 2>&1
            npm install --no-audit --no-fund "$PACK_DIR"/*.tgz
          )
          (cd "$install_dir" && node -e \
            "const bt = require('better-trigger'); if (typeof bt.task !== 'function') process.exit(1)")
          node -e '
            const fs = require("fs"), cp = require("child_process"), path = require("path");
            const packDir = process.env.PACK_DIR;
            const versions = {};
            for (const f of fs.readdirSync(packDir)) {
              if (!f.endsWith(".tgz")) continue;
              const p = JSON.parse(cp.execSync("tar -xzOf " + JSON.stringify(path.join(packDir, f)) + " package/package.json").toString());
              versions[p.name] = p.version;
            }
            const workerTgz = fs.readdirSync(packDir).find((f) => f.startsWith("better-trigger-worker-"));
            if (workerTgz === undefined) throw new Error("no worker tarball in pack set");
            const manifest = JSON.parse(cp.execSync(
              "tar -xzOf " + JSON.stringify(path.join(packDir, workerTgz)) + " package/package.json",
            ).toString());
            for (const [name, spec] of Object.entries(manifest.dependencies)) {
              if (!name.startsWith("@better-trigger/")) continue;
              if (!/^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/.test(spec)) throw new Error("unrewritten workspace dep " + name + "=" + spec);
              if (versions[name] !== spec) throw new Error(name + "@" + spec + " not in this pack set " + JSON.stringify(versions));
            }
          '

      # Publish in the fixed dependency order via OIDC trusted publishing:
      # npm exchanges the job's id-token (permissions above) for a one-time
      # credential and signs a provenance attestation for each tarball. No
      # long-lived token is read. If any publish fails the workflow stops
      # here: no commit, no tag. Retry with a NEW explicit version (npm
      # refuses to overwrite a published version).
      - name: Publish to npm (core → db → kernel → sdk → worker)
        run: |
          # 1. core
          npm publish --access public --provenance "$PACK_DIR"/better-trigger-core-*.tgz
          # 2. db
          npm publish --access public --provenance "$PACK_DIR"/better-trigger-db-*.tgz
          # 3. kernel
          npm publish --access public --provenance "$PACK_DIR"/better-trigger-kernel-*.tgz
          # 4. sdk (name on the registry is `better-trigger`)
          npm publish --access public --provenance "$PACK_DIR"/better-trigger-[0-9]*.tgz
          # 5. worker — last: depends on every package above
          npm publish --access public --provenance "$PACK_DIR"/better-trigger-worker-*.tgz

      # Only after every publish succeeded: record the bump. The committed
      # apps/worker/src/generated/build-info.ts was rewritten by the
      # post-bump rebuild and carries the new version, so it is part of
      # this commit.
      - name: Commit, tag and push
        run: |
          ver=$(node -p "require('./packages/core/package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: v$ver"
          git tag "v$ver"
          git push origin "HEAD:${{ github.ref_name }}"
          git push origin "v$ver"
