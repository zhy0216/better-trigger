# =============================================================================
# Deploy the VitePress docs site (apps/docs) to GitHub Pages.
#
# Pages is configured in the repo settings with build_type "workflow", so this
# workflow builds the static site and hands it to actions/deploy-pages. The
# site lives at https://zhy0216.github.io/better-trigger/ (base: /better-trigger/).
# =============================================================================
name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - "bun.lock"
      - ".github/workflows/docs.yml"
  # A PR that breaks the VitePress build or a mermaid diagram used to merge
  # green and only fail at deploy time. The build job below runs for PRs too;
  # the Pages upload/deploy steps are gated off (a fork PR has no Pages write
  # token anyway).
  pull_request:
    paths:
      - "apps/docs/**"
      - "bun.lock"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      # P2-20: same lockfile-keyed bun cache as ci.yml (see its comment).
      # The trigger paths above already include bun.lock, so the cache key
      # only rolls over when the workflow itself re-runs for a real reason.
      - name: Cache bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            examples/*/node_modules
            .turbo/cache
          key: ${{ runner.os }}-bun-1.4.0-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-1.4.0-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Validate mermaid diagrams
        working-directory: apps/docs
        run: bun run check:mermaid

      - name: Build
        working-directory: apps/docs
        run: bun run build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: apps/docs/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
