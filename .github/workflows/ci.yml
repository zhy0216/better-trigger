# =============================================================================
# CI — dependency audit, reproducible packaging guards, build, typecheck, unit
# tests, then the acceptance harnesses and a real container runtime smoke.
#
# The acceptance suite (examples/basic/scripts) is the project's real
# correctness evidence and needs a live Postgres, hence the service container.
# `bun run test` is the DB-free half (pure functions) and runs first so a broken
# unit-level invariant fails fast, before ~minutes of fault injection.
#
# The packaging guards bracket the build because that is what they need:
# `check:deps` only reads package.json (so it runs first, failing in ms), while
# the artifact/export/package-metadata checks resolve the actual dist/tarballs
# and therefore run after it. `check:drift` joins the cheap end: it reads
# packages/db only and needs no database.
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: build + test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: better_trigger
        ports:
          - 5432:5432
        # The harnesses connect immediately on start; wait for a real handshake.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # Each harness derives its own database name from this base URL and
      # provisions it via the admin `postgres` database (DROP/CREATE).
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/better_trigger

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      # P2-20: the bun install cache (global store + the workspace node_modules
      # trees it links into) keyed on bun.lock. One-time runners otherwise
      # re-download and re-link ~570 packages per job — including once per
      # node-smoke matrix leg. The Install step still runs after a hit:
      # --frozen-lockfile against an identical tree is a fast no-op and
      # repairs any drift the cache could not carry. `.turbo/cache` rides the
      # same key: the core→db→kernel→sdk→worker→web build chain is otherwise
      # rebuilt in full by every job. The worker build deliberately opts out of
      # Turbo caching because its identity also follows live Git dirty state;
      # the provenance-rollover build below proves that boundary while the
      # other packages continue to use the restored cache.
      - name: Cache bun dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            examples/*/node_modules
            .turbo/cache
          key: ${{ runner.os }}-bun-1.4.0-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-1.4.0-

      - name: Install
        run: bun install --frozen-lockfile

      # F3: check-audit pins the official npm advisory endpoint internally,
      # resolves findings against the exact bun.lock chains, and never permits
      # a high/critical exception. Keep it directly after install so a known
      # vulnerability fails before either build or test consumes runner time.
      - name: Dependency security audit
        run: bun run check:audit

      # O5 (P2-20 extended it to .ts/.tsx): every workspace runs the shared
      # lint baseline (eslint.config.mjs) — web picks it up from its own
      # config, the rest resolve it from the repo root. The type checking is
      # still done by tsc in the Typecheck step below; lint on TS files is
      # parser-only with the same baseline rules. Runs first so a lint
      # regression fails in seconds, before the build.
      - name: Lint
        run: bun run lint

      # core must stay at zero runtime dependencies and the SDK must depend on
      # nothing but core — see docs/architecture.md on the client/daemon split.
      - name: Dependency guard
        run: bun run check:deps

      # schema.ts is the source of truth but nothing runs it — daemons apply the
      # generated .sql. A schema edit without a `db:generate` reaches no
      # database, and the next unrelated generate folds it in silently. Offline:
      # `drizzle-kit generate` only diffs schema.ts against migrations/meta, so
      # this step does not touch the postgres service above.
      - name: Migration drift
        run: bun run check:drift

      # F1/F2: exercise the real build boundary twice without clearing the
      # restored Turbo cache. The first build stamps a previous-SHA fixture;
      # the second must clean both that identity and a synthetic orphan before
      # stamping the exact commit under test. check:artifacts walks the final
      # entry/chunk/map graph AND Bun's pack list, so these assertions cover the
      # bytes that health, metrics, workers.code_version and npm receive.
      - name: Build + provenance rollover guard
        env:
          PREVIOUS_BUILD_SHA: 0000000000000000000000000000000000000000
        run: |
          set -euo pipefail
          export BT_GIT_SHA="$PREVIOUS_BUILD_SHA"
          bun run build
          bun run --cwd apps/worker check:artifacts \
            --expected-sha "$PREVIOUS_BUILD_SHA"

          cp apps/worker/dist/index.js apps/worker/dist/runtime-ci-orphan.js
          export BT_GIT_SHA="$GITHUB_SHA"
          bun run build
          bun run --cwd apps/worker check:artifacts \
            --expected-sha "$GITHUB_SHA" \
            --reject-sha "$PREVIOUS_BUILD_SHA"

      # publint + attw on the built tarballs: the dual ESM/CJS maps and the
      # ./internal + worker/embedded subpaths are the kind of thing that only
      # breaks after publish.
      - name: Package exports
        run: bun run check:exports

      # F7: pack all five public packages, verify engines/sideEffects from the
      # tarball manifests, exercise every ESM/CJS entry from a clean install,
      # and prove the audited tree-shaking behavior. The Node matrix below
      # reuses this same script rather than carrying a second manifest checker.
      - name: Package metadata
        run: bun run check:pkg-meta

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      # O4: the registry artifact must work OUTSIDE the workspace. Each pack
      # is what would ship: `bun pm pack` rewrites workspace:* deps to the
      # workspace versions (npm 11 pack does not), so the tarballs install
      # from a clean temp dir with registry resolution only — proving a
      # release cannot be "workspace runs, registry package does not".
      # The worker tarball is additionally checked to carry the embedded
      # dashboard (O3: dist/public must travel with the package), and its CLI
      # is exercised --help before any database is needed. The SDK tarball is
      # import-checked in both module systems.
      - name: Pack + clean-install smoke (O4)
        run: |
          set -euo pipefail
          pack_dir=$(mktemp -d)
          for pkg in packages/core packages/kernel packages/db packages/sdk apps/worker; do
            (cd "$pkg" && bun pm pack --destination "$pack_dir" --quiet)
          done
          install_dir=$(mktemp -d)
          (
            cd "$install_dir"
            npm init -y >/dev/null 2>&1
            npm install --no-audit --no-fund "$pack_dir"/*.tgz
          )
          # The packed worker must ship the dashboard it promises to serve.
          check_dir=$(mktemp -d)
          tar -xzf "$pack_dir"/better-trigger-worker-*.tgz -C "$check_dir"
          test -f "$check_dir/package/dist/public/index.html"
          # CLI smoke from the clean install: --help must answer, no DB needed.
          "$install_dir/node_modules/.bin/better-trigger-worker" --help |
            grep -q -- '--tasks'
          # SDK smoke from the clean install, both module systems — run with
          # the install dir as cwd, or require/import would resolve the
          # workspace copy and the check would be vacuous.
          (cd "$install_dir" && node -e \
            "const bt = require('better-trigger'); if (typeof bt.task !== 'function') process.exit(1)")
          (cd "$install_dir" && node --input-type=module -e \
            "import('better-trigger').then((m) => { if (typeof m.task !== 'function') process.exit(1) })")
          # Embedded worker subpath, both module systems. Import only: starting
          # it would require Postgres/task config, while resolution/export shape
          # is the publishing invariant this clean install owns.
          (cd "$install_dir" && node -e \
            "const e = require('@better-trigger/worker/embedded'); if (typeof e.createEmbeddedRuntime !== 'function') process.exit(1)")
          (cd "$install_dir" && node --input-type=module -e \
            "import('@better-trigger/worker/embedded').then((m) => { if (typeof m.createEmbeddedRuntime !== 'function') process.exit(1) })")
          # Phase B — registry dependency correctness. Stage A installed the
          # five tarballs together, which cannot prove the worker's internal
          # deps would resolve from a registry. What CAN be proven here: (1)
          # the packed worker declares EXACT versions for its @better-trigger/*
          # deps (workspace:* must have been rewritten), and (2) those versions
          # are all in this pack set — the release order core→db→kernel→sdk→
          # worker guarantees they are published before the worker. A full
          # registry simulation (verdaccio &c.) is deliberately not added: the
          # tarballs ARE the published artifact, so version-exactness plus
          # installability is the maximum the repository can verify.
          # Plus the prepack guard: the dist inside the tarball must carry the
          # version the manifest declares — "new manifest + stale dist" fails
          # here instead of shipping.
          ver=$(node -e \
            "console.log(JSON.parse(require('fs').readFileSync('$check_dir/package/package.json','utf8')).version)")
          grep -rqF "\"$ver\"" "$check_dir/package/dist" || {
            echo "dist does not carry the packed version $ver (stale dist?)"
            exit 1
          }
          node -e '
            const fs = require("fs"), cp = require("child_process"), path = require("path");
            const packDir = process.argv[1], checkDir = process.argv[2];
            const worker = JSON.parse(fs.readFileSync(path.join(checkDir, "package", "package.json"), "utf8"));
            const versions = {};
            for (const f of fs.readdirSync(packDir)) {
              if (!f.endsWith(".tgz")) continue;
              const p = JSON.parse(cp.execSync("tar -xzOf " + JSON.stringify(path.join(packDir, f)) + " package/package.json").toString());
              versions[p.name] = p.version;
            }
            for (const [name, spec] of Object.entries(worker.dependencies)) {
              if (!name.startsWith("@better-trigger/")) continue;
              if (!/^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/.test(spec)) throw new Error("unrewritten workspace dep " + name + "=" + spec);
              if (versions[name] !== spec) throw new Error(name + "@" + spec + " not in this pack set " + JSON.stringify(versions));
            }
          ' "$pack_dir" "$check_dir"

      - name: Acceptance harnesses
        run: bun run test:acceptance

  # Consumer matrix: every published package promises Node >= 18. The shared
  # check:pkg-meta script packs all five tarballs, verifies engines/sideEffects
  # in those tarballs, clean-installs the complete graph, and imports every
  # public entry under process.execPath. Pinning Node 18/20/22 here therefore
  # tests the actual consumer runtime rather than the Bun build toolchain.
  node-smoke:
    name: node-smoke (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # setup-node BEFORE setup-bun so `node`/`npm` resolve to the matrix
      # version during the smoke assertions. The build toolchain itself needs
      # Bun: tsdown/rolldown no longer execute on every Node version that the
      # published artifacts support.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      # Same P2-20 cache as the main job. All three matrix legs share the key
      # (it is lockfile-locked, not Node-locked — the leg's Node version only
      # matters for the smoke assertions, not for what bun installs), so the
      # legs after the first restore instead of re-installing from scratch.
      - name: Cache bun dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            examples/*/node_modules
            .turbo/cache
          key: ${{ runner.os }}-bun-1.4.0-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-1.4.0-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        env:
          BT_GIT_SHA: ${{ github.sha }}
        run: bun run --bun build

      # Tree-shaking behavior is Bun-bundler-specific and is covered once in
      # the main job. Manifest and ESM/CJS entry checks still run on every
      # matrix Node through process.execPath.
      - name: Pack + metadata + edge-import smoke
        run: bun run check:pkg-meta -- --no-shake

  # apps/worker/Dockerfile is the image docker-compose ships. Build it without
  # pushing, then run it with an internal-only PostgreSQL network: this catches
  # runtime USER/permission, migration, task loading, deep-readiness and signal
  # handling regressions that a successful image build cannot see.
  docker:
    name: docker build + runtime smoke (worker image)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build worker image
        run: |
          docker build \
            -f apps/worker/Dockerfile \
            --build-arg GIT_SHA="$GITHUB_SHA" \
            -t better-trigger-worker:ci \
            .

      - name: Runtime smoke (non-root + PostgreSQL + graceful shutdown)
        env:
          WORKER_IMAGE: better-trigger-worker:ci
        run: |
          set -euo pipefail

          suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          network="better-trigger-ci-${suffix}"
          postgres_container="better-trigger-postgres-${suffix}"
          worker_container="better-trigger-worker-${suffix}"

          cleanup() {
            exit_status=$?
            cleanup_status=0
            trap - EXIT
            for container in "$worker_container" "$postgres_container"; do
              if docker container inspect "$container" >/dev/null 2>&1; then
                docker rm --force "$container" >/dev/null || cleanup_status=1
              fi
            done
            if docker network inspect "$network" >/dev/null 2>&1; then
              docker network rm "$network" >/dev/null || cleanup_status=1
            fi
            if ((exit_status == 0 && cleanup_status != 0)); then
              exit_status=$cleanup_status
            fi
            exit "$exit_status"
          }
          trap cleanup EXIT

          runtime_uid="$(
            docker run --rm --entrypoint bun "$WORKER_IMAGE" \
              -e 'process.stdout.write(String(process.getuid?.() ?? 0))'
          )"
          configured_user="$(docker image inspect --format '{{.Config.User}}' "$WORKER_IMAGE")"
          [[ "$runtime_uid" =~ ^[0-9]+$ ]] && ((runtime_uid != 0))
          [[ -n "$configured_user" && "$configured_user" != "root" && "$configured_user" != "0" ]]

          docker network create --internal "$network" >/dev/null
          docker run --detach \
            --name "$postgres_container" \
            --network "$network" \
            --network-alias postgres \
            --env POSTGRES_USER=postgres \
            --env POSTGRES_PASSWORD=postgres \
            --env POSTGRES_DB=better_trigger \
            postgres:16-alpine >/dev/null

          postgres_ready=0
          for _ in {1..30}; do
            if docker exec "$postgres_container" \
              pg_isready -U postgres -d better_trigger >/dev/null 2>&1; then
              postgres_ready=1
              break
            fi
            sleep 1
          done
          ((postgres_ready == 1))

          task_source="${GITHUB_WORKSPACE}/examples/basic/src/tasks.ts"
          [[ -r "$task_source" ]]
          docker run --detach \
            --name "$worker_container" \
            --network "$network" \
            --mount "type=bind,source=${task_source},target=/app/examples/basic/src/tasks.ts,readonly" \
            --env DATABASE_URL=postgres://postgres:postgres@postgres:5432/better_trigger \
            --env BETTER_TRIGGER_ALLOW_UNAUTHENTICATED=1 \
            "$WORKER_IMAGE" \
            bun apps/worker/dist/main.js \
              --tasks /app/examples/basic/src/tasks.ts >/dev/null

          [[ -z "$(docker port "$worker_container")" ]]
          mount_rw="$(
            docker inspect \
              --format '{{range .Mounts}}{{if eq .Destination "/app/examples/basic/src/tasks.ts"}}{{.RW}}{{end}}{{end}}' \
              "$worker_container"
          )"
          [[ "$mount_rw" == "false" ]]

          health_status=""
          for _ in {1..60}; do
            container_state="$(docker inspect --format '{{.State.Status}}' "$worker_container")"
            if [[ "$container_state" != "running" ]]; then
              docker logs "$worker_container"
              exit 1
            fi
            if health_status="$(
              docker exec "$worker_container" bun -e '
                const response = await fetch("http://127.0.0.1:4848/api/v1/health?deep=1");
                const body = await response.json();
                process.stdout.write(String(response.status));
                process.exit(response.ok && body?.db?.ok === true ? 0 : 1);
              ' 2>/dev/null
            )"; then
              break
            fi
            sleep 1
          done
          [[ "$health_status" =~ ^2[0-9][0-9]$ ]]

          migration_count="$(
            docker exec "$postgres_container" \
              psql -U postgres -d better_trigger -Atqc \
                'SELECT count(*) FROM drizzle.__drizzle_migrations'
          )"
          [[ "$migration_count" =~ ^[1-9][0-9]*$ ]]

          docker exec "$worker_container" bun -e '
            const response = await fetch("http://127.0.0.1:4848/api/v1/tasks");
            const body = await response.json();
            const loaded = response.ok && Array.isArray(body?.tasks) &&
              body.tasks.some((task) => task.id === "hello-world");
            if (!loaded) {
              console.error(JSON.stringify({ status: response.status, body }));
              process.exit(1);
            }
          '

          shutdown_started=$SECONDS
          docker stop --time 40 "$worker_container" >/dev/null
          shutdown_elapsed=$((SECONDS - shutdown_started))
          worker_exit="$(docker inspect --format '{{.State.ExitCode}}' "$worker_container")"
          worker_logs="$(docker logs "$worker_container" 2>&1)"
          [[ "$worker_exit" == "0" ]]
          ((shutdown_elapsed < 40))
          grep -Fq '[better-trigger] SIGTERM received, draining...' <<<"$worker_logs"
          grep -Fq '[better-trigger] handoff complete:' <<<"$worker_logs"
          printf 'uid=%s user=%s deep-health=%s migrations=%s shutdown=%ss exit=%s\n' \
            "$runtime_uid" "$configured_user" "$health_status" "$migration_count" \
            "$shutdown_elapsed" "$worker_exit"
